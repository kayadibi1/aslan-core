[project]
name = "aslan-core"
version = "0.8.0"
description = "Shared Python package for the Aslan Terminal data-plane services."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "kayadibi1", email = "sidarvig@gmail.com" }]

dependencies = [
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "click>=8.1",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "aioboto3>=13.0",
    "redis>=5.0",
]

[project.optional-dependencies]
# v0.3.0 observability extra. Consumers that want Sentry error
# capture, OpenTelemetry tracing (with SQLAlchemy + asyncpg
# auto-instrumentation), and Prometheus metrics scraping install
# ``aslan-core[obs]``. The base install runs without these — the
# observability modules use lazy imports so a missing dep raises
# ImportError only when ``setup_sentry("dsn")`` or
# ``setup_tracing("endpoint")`` is actually called with a non-None
# argument; ``setup_*(None)`` is always a no-op and never imports
# the SDK.
obs = [
    "sentry-sdk>=2.18",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-asyncpg>=0.48b0",
    "prometheus-client>=0.21",
]
# v0.6.0 dashboard extra. Consumers that want the read-only operator
# web UI install ``aslan-core[dashboard]``. The base install runs
# without these — ``aslan_core.dashboard`` imports at signature level
# only; ``serve()`` calls ``uvicorn.run`` lazily so a missing dep
# raises ``ImportError`` only at start-up time, never at import time.
dashboard = [
    "python-fasthtml >=0.6,<1.0",
    "uvicorn[standard] >=0.30",
    # Codex post-implementation review: /metrics + the Dashboard
    # request counter / duration histogram are operator-facing
    # signals, not optional. Pinning ``prometheus-client`` here
    # (rather than only in [obs]) ensures every documented
    # ``aslan-core[dashboard]`` install ships non-empty metrics so
    # 500-spike alerts work out of the box.
    "prometheus-client >=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[minio,postgres,redis]>=4.7",
    "hypothesis>=6.152.4",
    "ruff>=0.7",
    "mypy>=1.20",
    "pre-commit>=3.8",
    "types-PyYAML>=6.0",
    # v0.6.0 dashboard lint dep (codex F-3): the static-SQL scanner
    # parses queries.py text() literals via sqlglot's PostgreSQL
    # dialect and enforces the column-allowlist from migrations
    # 0020/0021/0022. Lint-only; the dashboard runtime never imports it.
    "sqlglot>=25.0",
]

[project.scripts]
aslan = "aslan_core.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aslan_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4",
    "DTZ",      # tz-aware datetimes
    "PIE", "RET", "SIM", "TID", "ASYNC", "S", "RUF",
]
ignore = [
    "S101",     # asserts ok in tests
    "N818",     # error names like EntityMergeRequired (no -Error suffix) are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "RUF001", "RUF002", "RUF003"]
"src/aslan_core/db/migrations/versions/*.py" = ["E501"]   # generated migrations may exceed 100
# PII regex + comments deliberately use Turkish characters (ÇĞİÖŞÜ + lowercase)
# that ruff flags as ambiguous against ASCII look-alikes.
"src/aslan_core/timeseries/pii.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "alembic.*",
    "testcontainers.*",
    "aioboto3.*",
    "botocore.*",
    # v0.6.0 [dashboard] extra. python-fasthtml + its starlette
    # transitive dep ship without py.typed markers under uv's lock;
    # mypy can't analyse them under strict.
    "fasthtml.*",
    "starlette.*",
    # v0.6.0 dashboard runtime dep — uvicorn[standard] ships without
    # py.typed; only ``serve()`` imports it (lazy) so runtime callers
    # without the [dashboard] extra are unaffected.
    "uvicorn.*",
    # v0.6.0 codex F-3 lint dep (dev-group). sqlglot ships without
    # a py.typed marker.
    "sqlglot.*",
    # v0.6.0 dashboard test dep. httpx is a transitive of starlette
    # (used in tests via httpx.AsyncClient + ASGITransport).
    "httpx.*",
]
ignore_missing_imports = true

# v0.3.0 [obs] extra — sentry-sdk, opentelemetry, prometheus_client are
# optional install deps. The observability modules use lazy imports so
# the base install runs without them; mypy on a base venv must not
# fail for the missing imports inside those lazy bodies.
[[tool.mypy.overrides]]
module = [
    "sentry_sdk.*",
    "opentelemetry.*",
    "prometheus_client.*",
]
ignore_missing_imports = true

# opentelemetry-instrumentation-* ships untyped __init__ args
# (capture_parameters=False without a type annotation), so calling
# their constructors from strict-mypy code triggers no-untyped-call.
# Relax this in the modules that touch the instrumentation API.
[[tool.mypy.overrides]]
module = [
    "aslan_core.observability.tracing",
    "tests.integration.test_observability_smoke",
]
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not integration"]
filterwarnings = [
    "error",
    # testcontainers' RedisContainer module triggers a DeprecationWarning
    # at IMPORT time about the deprecated `@wait_container_is_ready`
    # decorator (their internal API). We don't own this warning; suppress
    # so ``from testcontainers.redis import RedisContainer`` does not
    # promote to an ImportError under our ``error`` warning policy.
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning",
]
markers = [
    "integration: requires the testcontainers Postgres+Timescale stack",
]

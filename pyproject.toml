[project]
name = "aslan-core"
version = "0.1.3"
description = "Shared Python package for the Aslan Terminal data-plane services."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "kayadibi1", email = "sidarvig@gmail.com" }]

dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "click>=8.1",
    "pyyaml>=6.0",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.7",
    "hypothesis>=6.110",
    "ruff>=0.7",
    "mypy>=1.20",
    "pre-commit>=3.8",
    "types-PyYAML>=6.0",
]

[project.scripts]
aslan = "aslan_core.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aslan_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4",
    "DTZ",      # tz-aware datetimes
    "PIE", "RET", "SIM", "TID", "ASYNC", "S", "RUF",
]
ignore = [
    "S101",     # asserts ok in tests
    "N818",     # error names like EntityMergeRequired (no -Error suffix) are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"src/aslan_core/db/migrations/versions/*.py" = ["E501"]   # generated migrations may exceed 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "alembic.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not integration"]
filterwarnings = ["error"]
markers = [
    "integration: requires the testcontainers Postgres+Timescale stack",
]

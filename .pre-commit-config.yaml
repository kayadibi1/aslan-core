repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.9
          - pydantic-settings>=2.6
          - sqlalchemy>=2.0
          - click>=8.1
          - pytest>=8.3
          - pytest-asyncio>=0.24
          - types-PyYAML
        args: [--strict, src, tests]
        pass_filenames: false

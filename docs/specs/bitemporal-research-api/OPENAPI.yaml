        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/AsOfRange'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/DisplayTz'
        - $ref: '#/components/parameters/EntityId'
        - name: filing_id
          in: query
          schema:
            type: string
            example: KAP-2024-1234567
        - name: statement_type
          in: query
          schema:
            type: string
            enum: [balance_sheet, income_statement, cash_flow, equity_changes]
            example: income_statement
        - name: line_code
          in: query
          schema:
            type: string
            example: revenue_total
        - name: consolidation
          in: query
          schema:
            type: string
            enum: [solo, consolidated]
            example: consolidated
        - name: period_end
          in: query
          schema:
            type: string
            format: date
            example: 2024-12-31
      responses:
        '200':
          description: Financial line items envelope.
          headers:
            X-Request-Id:

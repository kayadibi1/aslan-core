            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ok:
                  value:
                    status: ok
                    checks:
                      postgres: ok
                      feature_flags: ok
                      audit_log: ok
                    timestamp: 2026-05-09T11:42:01Z
        '503':
          description: Service unhealthy.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                degraded:
                  value:
                    status: degraded
                    checks:
                      postgres: error
                      feature_flags: ok
                      audit_log: ok
                    error_detail: Connection refused on aslan-dashboard-postgres-1:5432
                    timestamp: 2026-05-09T11:42:01Z

  /version:
    get:
      tags: [ops]
      summary: Server version and active feature flags
      operationId: version
      description: |
        Returns the server's commit SHA, semver, and a snapshot of which
        feature flags are active in this environment. Useful for client-
        side diagnostics and for the SDK to gate features.
      security: []
      responses:
        '200':
          description: Version response.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              schema:
                type: string
              example: public, max-age=60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
              examples:
                staging:
                  value:
                    name: bitemporal-research-api
                    semver: 1.0.0-alpha
                    commit_sha: abc1234
                    built_at: 2026-05-09T08:00:00Z
                    environment: staging
                    feature_flags_active:
                      - BITEMPORAL_API_ENABLED
                      - BITEMPORAL_API_INTERVAL_QUERIES
                      - BITEMPORAL_API_ALLOW_NULL_AS_OF
                      - BITEMPORAL_API_RATE_LIMIT_ENFORCED
                      - BITEMPORAL_API_AUDIT_LOG_ENABLED
                      - BITEMPORAL_API_COST_LIMITS_ENFORCED
                      - BITEMPORAL_TABLE_REGISTRY_CI_ENFORCED
                    feature_flags_disabled:
                      - BITEMPORAL_API_TAS29_RESTATEMENT_CHAIN
                      - BITEMPORAL_API_ENTITY_MERGE_LINEAGE
                      - BITEMPORAL_API_KAP_APPEND_ONLY_TRIGGER
                      - BITEMPORAL_API_V2_PREVIEW
                      - BITEMPORAL_API_PII_EXPOSURE

  /openapi.json:
    get:
      tags: [ops]
      summary: Raw OpenAPI 3.1 document (JSON)
      operationId: openapiJson
      description: |
        Returns this OpenAPI document serialized as JSON. Companion surfaces:
        Swagger UI at `/v1/research/docs`, ReDoc at `/v1/research/redoc`.
        Per D21.
      security: []
      responses:
        '200':
          description: OpenAPI document.
          content:
            application/json:
              schema:
                type: object
                description: OpenAPI 3.1 document.

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Aslan-Api-Key
      description: |
        Long-lived API key (UUID v4 + 32-byte random secret), stored
        argon2id-hashed server-side. Per D5. Public verification endpoints
        (`/verify/moat-2`, `/healthz`, `/version`, `/openapi.json`) skip
        security.

  parameters:
    AsOf:
      name: as_of
      in: query
      required: false
      description: |
        Point-in-time query timestamp. ISO8601 with explicit timezone
        (`Z` or `±HH:MM`); naive datetimes are rejected (HTTP 400,
        `BITEMPORAL_AS_OF_NAIVE`). Default = `NOW()`. Mutually exclusive
        with `as_of_range`. Per D2 + D13.
      schema:
        type: string
        format: date-time
      example: 2024-06-15T14:30:00Z
    AsOfRange:
      name: as_of_range
      in: query
      required: false
      description: |
        Half-open interval `[T1,T2)` of ISO8601 timestamps. Returns the
        full version chain whose `as_of` fell in the interval. Mutually
        exclusive with `as_of`. Bound by D19 (≤5 years width by default,
        per-key configurable). Per D2.
      schema:
        type: string
        pattern: '^\[[^,]+,[^)]+\)$'
      example: '[2024-01-01T00:00:00Z,2025-01-01T00:00:00Z)'
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque base64-encoded keyset cursor returned by the previous
        response. Carries `(v, as_of, anchor, direction, filters_hash)`;
        server validates `filters_hash` to prevent cursor reuse across
        different filter sets. Per D7.
      schema:
        type: string
      example: eyJ2IjoxLCJhc19vZiI6IjIwMjQtMDYtMTVUMTQ6MzA6MDBaIn0=
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Default 50, max 500. Per D7 + D19.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
      example: 50
    DisplayTz:
      name: display_tz
      in: query
      required: false
      description: |
        IANA timezone identifier (e.g. `Europe/Istanbul`). Adds a
        `local_time` companion field to every row. Storage stays UTC;
        `as_of` and `ts` fields remain UTC ISO8601 with `Z`. Per D13.
      schema:
        type: string
      example: Europe/Istanbul
    IncludePreBitemporal:
      name: include_pre_bitemporal
      in: query
      required: false
      description: |
        PIT-only modifier (rejected with 400 BITEMPORAL_INTERVAL_INVALID
        when combined with `as_of_range`). When true, `/disclosures`
        also surfaces rows whose `as_of_provenance` is
        `pre_bitemporal_unknown` (a reserved enum value for backfill
        rows where the source's `index_fetched_at` was unknown — not
        emitted by the current production backfill but reserved for
        forward-compat with stricter schemas). Per D3 (revised
        round 8).
      schema:
        type: boolean
        default: false
    EntityId:
      name: entity_id
      in: query
      required: false
      description: Aslan-canonical entity ID (e.g. `ASL-ENT-00000001`).
      schema:
        type: string
        pattern: '^ASL-ENT-[0-9]{8}$'
      example: ASL-ENT-00000001

  headers:
    XRequestId:
      description: |
        Server-assigned request ID (UUID). Use this when filing support
        tickets; the API audit log is keyed by `request_id`.
      schema:
        type: string
        format: uuid
    XRateLimitTier:
      description: Authenticated key's rate tier (`internal`, `partner`, `public`). Per D6.
      schema:
        type: string
        enum: [internal, partner, public]
    XRateLimitRemaining:
      description: Tokens remaining in the current minute bucket.
      schema:
        type: integer
        minimum: 0
    XRateLimitReset:
      description: Epoch-seconds when the current minute bucket refills.
      schema:
        type: integer
        minimum: 0
    CacheControl:
      description: |
        `public, max-age=31536000, immutable` for `as_of <= NOW() - 5min`
        responses; `no-cache` otherwise. Per D17.
      schema:
        type: string
    ETag:
      description: |
        SHA-256 of canonical response body. Clients may revalidate with
        `If-None-Match`. Per D17.
      schema:
        type: string
    Deprecation:
      description: |
        Defined per IETF draft. Set to `true` when the endpoint is
        deprecated; absent otherwise. Per D24. No endpoints in v1 are
        deprecated.
      schema:
        type: string
        enum: ['true']
    Sunset:
      description: |
        Defined per RFC 8594. ISO8601 date when the deprecated endpoint
        will be removed. Minimum 6 months between deprecation and
        removal. Per D24.
      schema:
        type: string
        format: date-time

  responses:
    BitemporalAsOfNaive:
      description: '`as_of` lacked an explicit timezone, or other 400 conditions.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            naive_as_of:
              value:
                type: https://docs.aslanterminal.com/errors/BITEMPORAL_AS_OF_NAIVE
                title: as_of missing timezone
                status: 400
                detail: 'as_of=2024-06-15T14:30:00 is naive; ISO8601 with Z or ±HH:MM is required.'
                instance: /v1/research/observations
                request_id: 7f3a9b2c-1d4e-4f5a-9b2c-1d4e4f5a9b2c
                code: BITEMPORAL_AS_OF_NAIVE
                extensions:
                  received_value: 2024-06-15T14:30:00
            future_as_of:
              value:
                type: https://docs.aslanterminal.com/errors/BITEMPORAL_AS_OF_FUTURE
                title: as_of in the future
                status: 400
                detail: 'as_of=2099-01-01T00:00:00Z is later than NOW() + 60s clock-skew tolerance.'
                instance: /v1/research/observations
                request_id: 7f3a9b2c-1d4e-4f5a-9b2c-1d4e4f5a9b2c
                code: BITEMPORAL_AS_OF_FUTURE
                extensions:
                  received_value: 2099-01-01T00:00:00Z
                  server_now: 2026-05-09T11:42:01Z
            too_old_as_of:
              value:
                type: https://docs.aslanterminal.com/errors/BITEMPORAL_AS_OF_TOO_OLD
                title: as_of before platform epoch
                status: 400
                detail: 'as_of=1900-01-01T00:00:00Z is before the platform epoch 2018-01-01T00:00:00Z.'
                instance: /v1/research/observations
                request_id: 7f3a9b2c-1d4e-4f5a-9b2c-1d4e4f5a9b2c
                code: BITEMPORAL_AS_OF_TOO_OLD
                extensions:
                  received_value: 1900-01-01T00:00:00Z
                  platform_epoch: 2018-01-01T00:00:00Z
            interval_invalid:
              value:
                type: https://docs.aslanterminal.com/errors/BITEMPORAL_INTERVAL_INVALID
                title: as_of_range malformed
                status: 400
                detail: 'as_of_range=[2024-06-01,2024-01-01) has T1>=T2.'
                instance: /v1/research/observations
                request_id: 7f3a9b2c-1d4e-4f5a-9b2c-1d4e4f5a9b2c
                code: BITEMPORAL_INTERVAL_INVALID
                extensions:
                  received_value: '[2024-06-01,2024-01-01)'
    AuthInvalid:
      description: Bad/missing/expired API key.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        WWW-Authenticate:
          schema:
            type: string
          example: ApiKey realm="aslan-research"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missing:
              value:
                type: https://docs.aslanterminal.com/errors/AUTH_INVALID
                title: API key missing or invalid
                status: 401
                detail: X-Aslan-Api-Key header missing.
                instance: /v1/research/observations
                request_id: 7f3a9b2c-1d4e-4f5a-9b2c-1d4e4f5a9b2c
                code: AUTH_INVALID
                extensions: {}
    AuthForbidden:
      description: Key valid but lacks scope (e.g. `pii_unredacted`).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            no_pii_scope:
              value:
                type: https://docs.aslanterminal.com/errors/AUTH_FORBIDDEN
                title: API key forbidden from this resource
                status: 403
                detail: PII unredaction requires a key with pii_unredacted=true; this key has it false.
                instance: /v1/research/disclosures
                request_id: 7f3a9b2c-1d4e-4f5a-9b2c-1d4e4f5a9b2c
                code: AUTH_FORBIDDEN
                extensions:
                  required_scope: pii_unredacted
                  key_id: f7e6d5c4-b3a2-4918-87f6-e5d4c3b2a190
    PreBitemporalRegion:
      description: Resource has no bitemporal data at the requested `as_of`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            entity_not_yet_known:
              value:
                type: https://docs.aslanterminal.com/errors/BITEMPORAL_PRE_BITEMPORAL_REGION
                title: No bitemporal data at requested as_of
                status: 404
                detail: 'Entity ASL-ENT-00000001 has no row with as_of <= 2010-01-01T00:00:00Z.'
                instance: /v1/research/entities/ASL-ENT-00000001
                request_id: 7f3a9b2c-1d4e-4f5a-9b2c-1d4e4f5a9b2c
                code: BITEMPORAL_PRE_BITEMPORAL_REGION
                extensions:
                  earliest_known_as_of: 2018-03-15T10:00:00Z
                  requested_as_of: 2010-01-01T00:00:00Z
    IdentifierAmbiguous:
      description: Multiple `ref.identifier` rows match the lookup (data bug).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            ambiguous_ticker:
              value:
                type: https://docs.aslanterminal.com/errors/IDENTIFIER_AMBIGUOUS
                title: Identifier resolves to multiple entities
                status: 409
                detail: '(bist_ticker, GARAN, 2024-01-01T00:00:00Z) matched 2 entities; this is a data bug.'
                instance: /v1/research/identifiers/resolve
                request_id: 7f3a9b2c-1d4e-4f5a-9b2c-1d4e4f5a9b2c
                code: IDENTIFIER_AMBIGUOUS
                extensions:
                  candidates:
                    - entity_id: ASL-ENT-00000001
                      daterange: ['2000-06-30T00:00:00Z', null]
                    - entity_id: ASL-ENT-00000777
                      daterange: ['2024-01-01T00:00:00Z', null]
    QueryTooLarge:
      description: Query exceeds D19 cost cap.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            range_too_wide:
              value:
                type: https://docs.aslanterminal.com/errors/QUERY_TOO_LARGE
                title: as_of_range exceeds 5-year cap
                status: 413
                detail: 'as_of_range width is 7y; cap for tier=partner is 5y. Apply per-key override or paginate.'
                instance: /v1/research/observations
                request_id: 7f3a9b2c-1d4e-4f5a-9b2c-1d4e4f5a9b2c
                code: QUERY_TOO_LARGE
                extensions:
                  cap: 1825d
                  observed: 2557d
            too_many_entities:
              value:
                type: https://docs.aslanterminal.com/errors/QUERY_TOO_LARGE
                title: Too many entity_ids in filter
                status: 413
                detail: '120 distinct entity_ids in filter; cap is 100.'
                instance: /v1/research/financials/canonical
                request_id: 7f3a9b2c-1d4e-4f5a-9b2c-1d4e4f5a9b2c
                code: QUERY_TOO_LARGE
                extensions:
                  cap: 100
                  observed: 120
    RateLimited:
      description: Rate-limit bucket exhausted.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          description: Seconds until retry is permitted.
          schema:
            type: integer
        X-RateLimit-Tier:
          $ref: '#/components/headers/XRateLimitTier'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            tier_exceeded:
              value:
                type: https://docs.aslanterminal.com/errors/RATE_LIMITED
                title: Rate limit exceeded
                status: 429
                detail: 'partner tier permits 600 req/min; bucket exhausted.'
                instance: /v1/research/observations
                request_id: 7f3a9b2c-1d4e-4f5a-9b2c-1d4e4f5a9b2c
                code: RATE_LIMITED
                extensions:
                  tier: partner
                  retry_after_seconds: 23
    InternalError:
      description: Unhandled server error.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            generic:
              value:
                type: https://docs.aslanterminal.com/errors/INTERNAL_ERROR
                title: Internal server error
                status: 500
                detail: An unexpected error occurred. Reference request_id when filing a support ticket.
                instance: /v1/research/observations
                request_id: 7f3a9b2c-1d4e-4f5a-9b2c-1d4e4f5a9b2c
                code: INTERNAL_ERROR
                extensions: {}
    FeatureDisabled:
      description: Required feature flag is off (incl. master).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            master_off:
              value:
                type: https://docs.aslanterminal.com/errors/FEATURE_DISABLED
                title: Bitemporal API disabled in this environment
                status: 503
                detail: 'BITEMPORAL_API_ENABLED is false; the bitemporal API is not yet promoted in this environment.'
                instance: /v1/research/observations
                request_id: 7f3a9b2c-1d4e-4f5a-9b2c-1d4e4f5a9b2c
                code: FEATURE_DISABLED
                extensions:
                  flag: BITEMPORAL_API_ENABLED
                  state: false
            tas29_off:
              value:
                type: https://docs.aslanterminal.com/errors/FEATURE_DISABLED
                title: TAS 29 restatement chain disabled
                status: 503
                detail: '?restatement_kind=tas29 requires BITEMPORAL_API_TAS29_RESTATEMENT_CHAIN, which is currently false.'
                instance: /v1/research/financials/canonical
                request_id: 7f3a9b2c-1d4e-4f5a-9b2c-1d4e4f5a9b2c
                code: FEATURE_DISABLED
                extensions:
                  flag: BITEMPORAL_API_TAS29_RESTATEMENT_CHAIN
                  state: false

  schemas:
    Lineage:
      type: object
      description: |
        Lineage tuple for an extracted fact. Per D15 + ADR-003 replayability:
        every fact must be reconstructable from the source bytes plus this
        tuple. All fields nullable because not every fact is LLM-extracted
        (e.g. `ts.observation` rarely carries lineage).
      properties:
        source_filing_id:
          type: [string, 'null']
          description: Originating filing identifier (e.g. KAP disclosure id).
          example: KAP-2024-1234567
        raw_bytes_sha256:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 hex of the raw source bytes.
          example: 4f1a8c3d9e5b7a2f8c1d3e6b9a4c7f8e1d2a5b8c9e3f6a1d4b7c8e9f2a3b4c5d
        extraction_code_version:
          type: [string, 'null']
          description: Semver of the extraction code that produced the fact.
          example: 0.7.3
        prompt_version:
          type: [string, 'null']
          description: Identifier of the LLM prompt version (free-form).
          example: financials_v3
        model_identity:
          type: [string, 'null']
          description: Anthropic / OpenAI model identity string.
          example: claude-3-7-sonnet-20250219
        extraction_seed:
          type: [integer, 'null']
          description: Seed used in the extraction call (where supported).
          example: 42
      required:
        - source_filing_id
        - raw_bytes_sha256
        - extraction_code_version
        - prompt_version
        - model_identity
        - extraction_seed

    Pagination:
      type: object
      description: Cursor-based pagination per D7.
      properties:
        next_cursor:
          type: [string, 'null']
          description: Opaque cursor for the next page; null on the last page.
          example: eyJ2IjoxLCJhc19vZiI6IjIwMjQtMDYtMzBUMjM6NTk6NTlaIn0=
        prev_cursor:
          type: [string, 'null']
          description: Opaque cursor for the previous page; null on the first page.
        has_more:
          type: boolean
          description: True if `next_cursor` is non-null.
        total_count_estimate:
          type: [integer, 'null']
          description: |
            Approximate total row count under the current filter.
            Postgres `pg_class.reltuples`-derived; best-effort, not exact.
            Null when not cheap to compute.
      required:
        - next_cursor
        - prev_cursor
        - has_more
        - total_count_estimate

    Warning:
      type: object
      description: Non-fatal advisory attached to a successful response.
      properties:
        code:
          type: string
          description: Machine-readable warning code.
          example: PRE_BITEMPORAL_ROWS_INCLUDED
        message:
          type: string
          description: Human-readable explanation.
          example: 372,318 rows with as_of=NULL included due to include_pre_bitemporal=true.
        rows_affected:
          type: integer
          minimum: 0
          example: 372318
      required: [code, message, rows_affected]

    EnvelopeMetadata:
      type: object
      description: |
        Envelope metadata block per D15. `as_of_requested` reflects the
        client's literal input (or null for the default); `as_of_resolved`
        is what the server actually used (e.g. `NOW()` resolved to a
        concrete timestamp).
      properties:
        as_of_requested:
          type: [string, 'null']
          format: date-time
          description: 'Client-supplied `as_of`; null when default (`NOW()`).'
          example: 2024-06-15T14:30:00Z
        as_of_resolved:
          type: string
          format: date-time
          description: The server's resolved `as_of` (UTC ISO8601 with `Z`).
          example: 2024-06-15T14:30:00Z
        as_of_range:
          type: [array, 'null']
          minItems: 2
          maxItems: 2
          items:
            type: string
            format: date-time
          description: 'When the request was an interval query, the [T1,T2) bounds.'
        lineage:
          $ref: '#/components/schemas/Lineage'
        pagination:
          $ref: '#/components/schemas/Pagination'
        feature_flags_active:
          type: array
          items:
            type: string
          description: Snapshot of feature flags effective for this request.
          example:
            - BITEMPORAL_API_ENABLED
            - BITEMPORAL_API_AUDIT_LOG_ENABLED
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        request_id:
          type: string
          format: uuid
          description: Server-assigned request ID; matches `X-Request-Id`.
          example: 7f3a9b2c-1d4e-4f5a-9b2c-1d4e4f5a9b2c
        served_by:
          type: string
          description: '`bitemporal-api/<commit-sha>` identity of the serving instance.'
          example: bitemporal-api/abc1234
      required:
        - as_of_requested
        - as_of_resolved
        - as_of_range
        - lineage
        - pagination
        - feature_flags_active
        - warnings
        - request_id
        - served_by

    Problem:
      type: object
      description: RFC 7807 problem document per D16.
      properties:
        type:
          type: string
          format: uri
          description: Stable URI naming the error class.
          example: https://docs.aslanterminal.com/errors/BITEMPORAL_AS_OF_NAIVE
        title:
          type: string
          description: Short human-readable summary.
          example: as_of missing timezone
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP status code.
          example: 400
        detail:
          type: string
          description: Long human-readable explanation.
          example: 'as_of=2024-06-15T14:30:00 is naive; ISO8601 with Z or ±HH:MM is required.'
        instance:
          type: string
          description: Request URI.
          example: /v1/research/observations
        request_id:
          type: string
          format: uuid
          description: Server-assigned request ID.
          example: 7f3a9b2c-1d4e-4f5a-9b2c-1d4e4f5a9b2c
        code:
          type: string
          description: Stable machine code per D16.
          enum:
            - BITEMPORAL_AS_OF_NAIVE
            - BITEMPORAL_AS_OF_FUTURE
            - BITEMPORAL_AS_OF_TOO_OLD
            - BITEMPORAL_PRE_BITEMPORAL_REGION
            - BITEMPORAL_INTERVAL_INVALID
            - IDENTIFIER_AMBIGUOUS
            - RATE_LIMITED
            - AUTH_INVALID
            - AUTH_FORBIDDEN
            - QUERY_TOO_LARGE
            - FEATURE_DISABLED
            - INTERNAL_ERROR
        extensions:
          type: object
          description: Error-specific structured payload.
          additionalProperties: true
      required: [type, title, status, detail, instance, request_id, code, extensions]

    Observation:
      type: object
      description: A `ts.observation` row (PIT projection).
      properties:
        series_id:
          type: integer
          format: int64
          description: |
            Numeric `ts.series_catalog.series_id` referenced by the row. Use
            the `/observations` `series_code` query param to look up by
            string code (e.g. `BIST.GARAN.close`).
          example: 1234
        ts:
          type: string
          format: date-time
          description: Observation wall-clock timestamp (UTC).
          example: 2024-06-03T15:30:00Z
        value:
          type: number
          example: 86.45
        unit:
          type: string
          example: TRY
        as_of:
          type: string
          format: date-time
          description: Platform-known time at which this row was recorded (UTC).
          example: 2024-06-03T15:30:11Z
        local_time:
          type: [string, 'null']
          format: date-time
          description: 'Same instant in `display_tz`; null if `display_tz` not supplied.'
          example: 2024-06-03T18:30:11+03:00
      required: [series_id, ts, value, unit, as_of]

    FinancialLineItem:
      type: object
      description: A `ts.financial_line_item` row (PIT projection).
      properties:
        entity_id:
          type: string
          example: ASL-ENT-00000001
        filing_id:
          type: string
          example: KAP-2024-1234567
        statement_type:
          type: string
          enum: [balance_sheet, income_statement, cash_flow, equity_changes]
          example: income_statement
        line_code:
          type: string
          example: revenue_total
        consolidation:
          type: string
          enum: [solo, consolidated]
          example: consolidated
        period_end:
          type: string
          format: date
          example: 2024-12-31
        value:
          type: number
          example: 142500000000
        unit:
          type: string
          example: TRY
        currency:
          type: string
          example: TRY
        as_of:
          type: string
          format: date-time
          example: 2025-03-12T07:42:18Z
      required:
        - entity_id
        - filing_id
        - statement_type
        - line_code
        - consolidation
        - period_end
        - value
        - unit
        - as_of

    CanonicalFinancial:
      type: object
      description: |
        A `ts.canonical_financial` row (PIT projection). Per D8, TAS 29
        restatements appear as new rows with later `as_of` and
        `restatement_kind='tas29'`.
      properties:
        entity_id:
          type: string
          example: ASL-ENT-00000001
        period_end:
          type: string
          format: date
          example: 2023-12-31
        line_item_id:
          type: string
          example: revenue_total
        value:
          type: number
          example: 78400000000
        unit:
          type: string
          example: TRY
        restatement_kind:
          type: string
          description: Provenance tag per D8.
          enum: [nominal, tas29, ifrs_restate, errata]
          example: nominal
        as_of:
          type: string
          format: date-time
          example: 2024-03-15T08:12:33Z
      required:
        - entity_id
        - period_end
        - line_item_id
        - value
        - unit
        - restatement_kind
        - as_of

    Entity:
      type: object
      description: |
        A `ref.entity` row (PIT projection). Per D10, merges produce a
        new row with `merged_from_entity_ids` populated; splits populate
        `split_from_entity_id`.
      properties:
        entity_id:
          type: string
          pattern: '^ASL-ENT-[0-9]{8}$'
          example: ASL-ENT-00000001
        canonical_name:
          type: string
          description: Verbatim canonical name (Turkish preserved per ADR-002).
          example: Türkiye Garanti Bankası A.Ş.
        kind:
          type: string
          enum: [issuer, fund, sovereign, person, government, other]
          example: issuer
        country:
          type: string
          description: ISO 3166-1 alpha-2.
          example: TR
        merged_from_entity_ids:
          type: array
          items:
            type: string
            pattern: '^ASL-ENT-[0-9]{8}$'
          description: Entities merged into this one (D10).
          example: []
        split_from_entity_id:
          type: [string, 'null']
          pattern: '^ASL-ENT-[0-9]{8}$'
          description: Entity this one was split off from (D10); null otherwise.
        as_of:
          type: string
          format: date-time
          example: 2026-01-15T10:00:00Z
        lineage_events:
          type: array
          description: |
            Merge / split / rename events for this entity at or before
            `as_of`, sourced from `ref.entity_lineage_at(:as_of)`.
          items:
            type: object
            properties:
              event_kind:
                type: string
                enum: [created, updated, merged, split, renamed, deleted]
              from:
                type: [string, 'null']
              into:
                type: [string, 'null']
              event_at:
                type: [string, 'null']
                format: date-time
              reason:
                type: [string, 'null']
            required: [event_kind, from, into, event_at, reason]
      required:
        - entity_id
        - canonical_name
        - kind
        - country
        - merged_from_entity_ids
        - split_from_entity_id
        - as_of
        - lineage_events

    Identifier:
      type: object
      description: A `ref.identifier` row (PIT projection).
      properties:
        namespace:
          type: string
          enum: [bist_ticker, isin, vkn, mkk_id, kap_company_id, lei, cusip, sedol]
          example: bist_ticker
        value:
          type: string
          example: GARAN
        entity_id:
          type: string
          pattern: '^ASL-ENT-[0-9]{8}$'
          example: ASL-ENT-00000001
        daterange:
          type: array
          minItems: 2
          maxItems: 2
          description: '`tstzrange [valid_from, valid_to)`; valid_to=null means open-ended.'
          items:
            type: [string, 'null']
            format: date-time
          example: ['2000-06-30T00:00:00Z', null]
      required: [namespace, value, entity_id, daterange]

    Disclosure:
      type: object
      description: |
        A `kap.disclosures` row (PIT projection). Per D3, pre-bitemporal
        rows carry `pre_bitemporal=true` and `as_of_provenance` documents
        which column the `as_of` was derived from (or
        `pre_bitemporal_unknown` for NULL `as_of`).
      properties:
        disclosure_id:
          type: string
          example: KAP-2024-1234567
        kap_company_id:
          type: string
          example: '4028'
        entity_id:
          type: [string, 'null']
          pattern: '^ASL-ENT-[0-9]{8}$'
          example: ASL-ENT-00000001
        form_type:
          type: string
          description: |
            KAP form type code (Turkish; preserved verbatim). Aliased
            from the underlying `category_code` column.
          example: ÖDA
        category_code:
          type: string
          description: KAP category code (same as `form_type`; surfaced for direct DB alignment).
          example: ÖDA
        subcategory_code:
          type: [string, 'null']
          description: KAP subcategory code where present.
          example: null
        title:
          type: string
          description: Disclosure title (Turkish; preserved verbatim per ADR-002).
          example: Kâr Payı Dağıtım Bildirimi
        published_at:
          type: string
          format: date-time
          description: Official KAP publication time.
          example: 2024-03-15T10:00:00Z
        is_amendment:
          type: boolean
          description: True when this disclosure amends an earlier filing.
          example: false
        body_fetched:
          type: boolean
          example: true
        body_fetched_at:
          type: [string, 'null']
          format: date-time
          example: 2024-03-15T10:00:11Z
        republished_as:
          type: [string, 'null']
          description: |
            Disclosure ID of the amendment, if this was superseded. Maps
            to the physical `parent_disclosure_id` column (see migration
            0051).
          example: KAP-2024-1234568
        event_kind:
          type: [string, 'null']
          description: |
            Bitemporal event that produced this version (one of
            `indexed`, `body_fetched`, `republished`, `updated`,
            `deleted`). Sourced from `kap.disclosures_at(:as_of)`.
          enum: [indexed, body_fetched, republished, updated, deleted, null]
          example: body_fetched
        as_of:
          type: [string, 'null']
          format: date-time
          description: Platform-known time; null for pre-bitemporal rows (D3).
          example: 2024-03-15T10:00:11Z
        as_of_provenance:
          type: string
          description: Column the `as_of` was derived from (D3).
          enum: [received_at, body_fetched_at, index_fetched_at, published_at, inserted_at, pre_bitemporal_unknown]
          example: body_fetched_at
        pre_bitemporal:
          type: boolean
          description: True for the ~372k legacy rows with NULL `as_of`.
          example: false
        attributes:
          type: object
          description: |
            Form-specific structured fields (e.g. dividend_amount_per_share).
            Open object; per-form-type schemas are documented at
            docs.aslanterminal.com/forms.
          additionalProperties: true
      required:
        - disclosure_id
        - kap_company_id
        - form_type
        - title
        - published_at
        - body_fetched
        - as_of_provenance
        - pre_bitemporal

    Filing:
      type: object
      description: A `doc.filing` row (PIT projection).
      properties:
        filing_id:
          type: string
          example: DOC-FIL-00000001
        entity_id:
          type: string
          pattern: '^ASL-ENT-[0-9]{8}$'
          example: ASL-ENT-00000001
        source_kind:
          type: string
          enum: [kap, bist, tcmb, mkk, tefas, other]
          example: kap
        source_filing_id:
          type: string
          example: KAP-2024-1234567
        filed_at:
          type: string
          format: date-time
          example: 2024-03-15T10:00:00Z
        title:
          type: string
          example: Kâr Payı Dağıtım Bildirimi
        as_of:
          type: string
          format: date-time
          example: 2024-03-15T10:00:33Z
      required: [filing_id, entity_id, source_kind, source_filing_id, filed_at, title, as_of]

    FilingEvent:
      type: object
      description: |
        An `agg.filing_event` row (PIT projection). Each event carries
        `superseded_at` per the existing schema; PIT queries respect
        `as_of` semantics.
      properties:
        event_id:
          type: string
          description: |
            Surface alias for the physical `filing_event_id` UUID
            (renamed at the API boundary per OpenAPI).
          example: AGG-FE-2024-0000123
        filing_id:
          type: string
          example: KAP-2024-1234567
        source_id:
          type: [string, 'null']
          description: Source system identity (e.g. `kap`, `bist`).
          example: kap
        source_filing_ref:
          type: [string, 'null']
          description: Source-system filing reference passed through verbatim.
          example: '2024-1234567'
        entity_id:
          type: string
          pattern: '^ASL-ENT-[0-9]{8}$'
          example: ASL-ENT-00000001
        counterparty_entity_id:
          type: [string, 'null']
          description: Aslan-canonical entity ID of the counterparty (D30).
          example: null
        event_type:
          type: string
          description: One of the 32-event taxonomy values (Moat 7).
          example: dividend_declared
        event_seq:
          type: integer
          minimum: 1
          example: 1
        occurred_at:
          type: string
          format: date-time
          description: |
            Wall-clock event timestamp (UTC). Aliased at the API boundary
            from the physical `event_ts` column.
          example: 2024-03-15T10:00:00Z
        effective_dt:
          type: [string, 'null']
          format: date
          description: Calendar date at which the event takes effect, when distinct.
          example: 2024-04-01
        attributes:
          type: object
          description: |
            Event-type-specific structured fields. PII keys
            (counterparty_name, counterparty_address, signatory_name)
            are redacted to `<REDACTED:counterparty>` unless the
            principal carries `pii_unredacted=true` (D30). Aliased at
            the API boundary from the physical `payload` column.
          additionalProperties: true
        as_of:
          type: string
          format: date-time
          example: 2024-03-15T10:00:33Z
        primary_confidence:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Primary-extraction confidence score.
          example: 0.97
        final_confidence:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Final (post-verification) confidence score.
          example: 0.99
        primary_model_version:
          type: [string, 'null']
          example: claude-3-7-sonnet-20250219
        primary_prompt_version:
          type: [string, 'null']
          example: filing_event_v3
      required:
        - event_id
        - filing_id
        - entity_id
        - event_type
        - event_seq
        - occurred_at
        - attributes
        - as_of

    # Per-endpoint envelopes (D15 generic-style via per-endpoint specialization).

  /financials/canonical:
    get:
      tags: [research]
      summary: List canonical (TAS 29-aware) financials point-in-time
      operationId: listCanonicalFinancials
      description: |
        Returns rows from `ts.canonical_financial` as known at `as_of`. Backed
        by `ts.canonical_financial_at(p_as_of)`.

        Per D8: a TAS 29 inflation-restated value is recorded as a **new
        row** with later `as_of` and `restatement_kind='tas29'`. PIT queries
        at the older `as_of` return the nominal value; PIT queries at the
        newer `as_of` return the restated value. Both rows persist forever.

        The `restatement_chain` mat-view walks the chain per
        `(entity_id, period_end, line_item_id)`.
      parameters:
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/AsOfRange'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/DisplayTz'
        - $ref: '#/components/parameters/EntityId'
        - name: period_end
          in: query
          schema:
            type: string
            format: date
            example: 2024-12-31
        - name: line_item_id
          in: query
          schema:
            type: string
            example: revenue_total
        - name: restatement_kind
          in: query
          description: Filter by restatement provenance.
          schema:
            type: string
            enum: [nominal, tas29, ifrs_restate, errata]
            example: tas29
      responses:
        '200':
          description: Canonical financials envelope.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Tier:
              $ref: '#/components/headers/XRateLimitTier'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanonicalFinancialListEnvelope'
              examples:
                tas29_restatement_chain:
                  summary: TAS 29 restatement chain for GARAN revenue FY2023
                  value:
                    data:
                      - entity_id: ASL-ENT-00000001
                        period_end: 2023-12-31
                        line_item_id: revenue_total
                        value: 78400000000
                        unit: TRY
                        restatement_kind: nominal
                        as_of: 2024-03-15T08:12:33Z
                      - entity_id: ASL-ENT-00000001
                        period_end: 2023-12-31
                        line_item_id: revenue_total
                        value: 142800000000
                        unit: TRY
                        restatement_kind: tas29
                        as_of: 2025-02-10T11:04:02Z
                    metadata:
                      as_of_requested: null
                      as_of_resolved: 2026-05-09T00:00:00Z
                      as_of_range:
                        - 2024-01-01T00:00:00Z
                        - 2026-01-01T00:00:00Z
                      lineage:
                        source_filing_id: KAP-2024-1234567
                        raw_bytes_sha256: 4f1a8c3d9e5b7a2f8c1d3e6b9a4c7f8e1d2a5b8c9e3f6a1d4b7c8e9f2a3b4c5d
                        extraction_code_version: 0.7.3
                        prompt_version: canonical_v2
                        model_identity: claude-3-7-sonnet-20250219
                        extraction_seed: 42
                      pagination:
                        next_cursor: null

  /verify/moat-2:
    get:
      tags: [verification]
      summary: Public Moat 2 canary status
      operationId: verifyMoat2
      description: |
        **Unauthenticated** public verification of Moat 2 (bitemporal
        point-in-time correctness).

        Returns `200 green` when the canary's most recent cycle had every
        case passing; returns `503 red` when any case failed.

        Cached server-side for 60 seconds; no per-IP rate limit
        (DDoS protection is upstream WAF). Per ADR-003 §"Verification
        endpoint" — anyone (customer, journalist, regulator) can audit
        the moat without an API key.

        The canary runs every 5 minutes against ≥10 hand-curated
        historical KAP amendments where `as_of_before` value differs from
        `as_of_after` value.
      security: []
      responses:
        '200':
          description: Canary green.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              description: Server-side cache window of 60s.
              schema:
                type: string
              example: public, max-age=60
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Moat2VerificationResult'
              examples:
                green:
                  summary: All cases passing
                  value:
                    moat_2: green
                    last_run_at: 2026-05-09T11:35:00Z
                    cases_total: 12
                    cases_passing: 12
                    failing_cases: []
                    canary_uptime_hours: 248.5
                    sample_amendment:
                      filing_id: KAP-2024-1234567
                      field: dividend_amount_per_share
                      as_of_before: 2024-03-15T10:00:11Z
                      value_before: '1.50'
                      as_of_after: 2024-03-15T16:30:42Z
                      value_after: '1.75'
        '503':
          description: Canary red — at least one case failing.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Moat2VerificationResult'
              examples:
                red:
                  summary: At least one case failing
                  value:
                    moat_2: red
                    last_run_at: 2026-05-09T11:40:00Z
                    cases_total: 12
                    cases_passing: 11
                    failing_cases:
                      - case_id: KAP-2023-AMEND-04
                        filing_id: KAP-2023-9876543
                        field: capital_increase_amount
                        as_of_before: 2023-11-02T09:15:00Z
                        expected_before: '500000000'
                        observed_before: '750000000'
                        as_of_after: 2023-11-02T14:45:00Z
                        expected_after: '750000000'
                        observed_after: '750000000'
                        diagnosis: as_of_before query returned post-amendment value — append-only invariant breached
                    canary_uptime_hours: 0.0
                    sample_amendment: null


                        total_count_estimate: 2
                      feature_flags_active:
                        - BITEMPORAL_API_ENABLED
                        - BITEMPORAL_API_TAS29_RESTATEMENT_CHAIN
                        - BITEMPORAL_API_INTERVAL_QUERIES

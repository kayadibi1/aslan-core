    Moat2FailingCase:
      type: object
      description: A single canary case that did not match its expected pre/post amendment values.
      properties:
        case_id:
          type: string
          example: KAP-2023-AMEND-04
        filing_id:
          type: string
          example: KAP-2023-9876543
        field:
          type: string
          example: capital_increase_amount
        as_of_before:
          type: string
          format: date-time
          example: 2023-11-02T09:15:00Z
        expected_before:
          type: string
          description: Stringified expected value at `as_of_before`.
          example: '500000000'
        observed_before:
          type: string
          description: Stringified observed value at `as_of_before`.
          example: '750000000'
        as_of_after:
          type: string
          format: date-time
          example: 2023-11-02T14:45:00Z
        expected_after:
          type: string
          example: '750000000'
        observed_after:
          type: string
          example: '750000000'
        diagnosis:
          type: string
          description: Free-form diagnosis from the canary script.
          example: as_of_before query returned post-amendment value — append-only invariant breached
      required:
        - case_id
        - filing_id
        - field
        - as_of_before
        - expected_before
        - observed_before
        - as_of_after
        - expected_after
        - observed_after
        - diagnosis

    Moat2SampleAmendment:
      type: object
      description: |
        A representative amendment showing the canary's load-bearing case:
        `as_of_before` value differs from `as_of_after` value. Per ADR-003.
      properties:
        filing_id:
          type: string
          example: KAP-2024-1234567
        field:
          type: string
          example: dividend_amount_per_share
        as_of_before:
          type: string
          format: date-time
          example: 2024-03-15T10:00:11Z
        value_before:
          type: string
          example: '1.50'
        as_of_after:
          type: string
          format: date-time
          example: 2024-03-15T16:30:42Z
        value_after:
          type: string
          example: '1.75'
      required:
        - filing_id
        - field
        - as_of_before
        - value_before
        - as_of_after
        - value_after

    Moat2VerificationResult:
      type: object
      description: Public canary result per D20 + ADR-003 §"Verification endpoint".
      properties:
        moat_2:
          type: string
          enum: [green, red]
          description: green = every case passed last cycle; red = at least one failed.
          example: green
        last_run_at:
          type: string
          format: date-time
          example: 2026-05-09T11:35:00Z
        cases_total:
          type: integer
          minimum: 0
          example: 12
        cases_passing:
          type: integer
          minimum: 0
          example: 12
        failing_cases:
          type: array
          items:
            $ref: '#/components/schemas/Moat2FailingCase'
        canary_uptime_hours:
          type: number
          minimum: 0
          description: Continuous green hours since last red→green transition.
          example: 248.5
        sample_amendment:
          oneOf:
            - $ref: '#/components/schemas/Moat2SampleAmendment'
            - type: 'null'
          description: |
            A representative amendment from the canary case set. When the
            canary is green, included as a Moat 2 demonstration; when red,
            null.
      required:
        - moat_2
        - last_run_at
        - cases_total
        - cases_passing
        - failing_cases
        - canary_uptime_hours

    HealthResponse:
      type: object
      description: Health probe payload.
      properties:
        status:
          type: string
          enum: [ok, degraded]
          example: ok
        checks:
          type: object
          description: Per-subsystem status.
          properties:
            postgres:
              type: string
              enum: [ok, error]
            feature_flags:
              type: string
              enum: [ok, error]
            audit_log:
              type: string
              enum: [ok, error]
          required: [postgres, feature_flags, audit_log]
        error_detail:
          type: string
          description: Free-form on degraded status.
        timestamp:
          type: string
          format: date-time
      required: [status, checks, timestamp]

    VersionResponse:
      type: object
      description: Server version + active feature flags.
      properties:
        name:
          type: string
          example: bitemporal-research-api
        semver:
          type: string
          example: 1.0.0-alpha
        commit_sha:
          type: string
          example: abc1234
        built_at:
          type: string
          format: date-time
          example: 2026-05-09T08:00:00Z
        environment:
          type: string
          enum: [development, staging, production]
          example: staging
        feature_flags_active:
          type: array
          items:
            type: string
        feature_flags_disabled:
          type: array
          items:
            type: string
      required:
        - name
        - semver
        - commit_sha
        - built_at
        - environment
        - feature_flags_active
        - feature_flags_disabled

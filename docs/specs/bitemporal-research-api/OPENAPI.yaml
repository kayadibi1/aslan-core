        '503':
          $ref: '#/components/responses/FeatureDisabled'

  /entities/{entity_id}:
    get:
      tags: [research]
      summary: Get a single entity point-in-time
      operationId: getEntity
      description: |
        Returns the `ref.entity` row for `entity_id` as known at `as_of`.
        Returns `404 BITEMPORAL_PRE_BITEMPORAL_REGION` if the entity did not
        yet exist at the requested `as_of`.
      parameters:
        - name: entity_id
          in: path
          required: true
          description: Aslan-canonical entity ID.
          schema:
            type: string
            pattern: '^ASL-ENT-[0-9]{8}$'
            example: ASL-ENT-00000001
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/DisplayTz'
      responses:
        '200':
          description: Entity envelope.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Tier:
              $ref: '#/components/headers/XRateLimitTier'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityEnvelope'
              examples:
                garanti_pit:
                  summary: GARAN as known on 2023-06-15
                  value:
                    data:
                      entity_id: ASL-ENT-00000001
                      canonical_name: Türkiye Garanti Bankası A.Ş.
                      kind: issuer
                      country: TR
                      merged_from_entity_ids: []
                      split_from_entity_id: null
                      as_of: 2023-06-15T10:00:00Z
                    metadata:
                      as_of_requested: 2023-06-15T14:30:00Z
                      as_of_resolved: 2023-06-15T14:30:00Z
                      as_of_range: null
                      lineage:
                        source_filing_id: null
                        raw_bytes_sha256: null
                        extraction_code_version: null
                        prompt_version: null
                        model_identity: null
                        extraction_seed: null
                      pagination:
                        next_cursor: null
                        prev_cursor: null
                        has_more: false
                        total_count_estimate: null
                      feature_flags_active:
                        - BITEMPORAL_API_ENABLED
                      warnings: []
                      request_id: 8c7b6a5d-4e3f-2a1b-0c9d-8e7f6a5b4c3d
                      served_by: bitemporal-api/abc1234
        '400':
          $ref: '#/components/responses/BitemporalAsOfNaive'
        '401':

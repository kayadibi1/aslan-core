  /entities:
    get:
      tags: [research]
      summary: List entities point-in-time
      operationId: listEntities
      description: |
        Returns rows from `ref.entity` as known at `as_of`. Backed by
        `ref.entity_at(p_as_of)`. Entities carry `merged_from_entity_ids`
        per D10; PIT queries at `as_of < merge_time` see pre-merge
        entities, at `as_of >= merge_time` see only the post-merge entity.
      parameters:
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/AsOfRange'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/DisplayTz'
        - name: name
          in: query
          description: Substring match against canonical entity name (case-insensitive).
          schema:
            type: string
            example: Garanti
        - name: country
          in: query
          schema:
            type: string
            example: TR
        - name: kind
          in: query
          schema:
            type: string
            enum: [issuer, fund, sovereign, person, government, other]
            example: issuer
      responses:
        '200':
          description: Entities envelope.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Tier:
              $ref: '#/components/headers/XRateLimitTier'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityListEnvelope'
              examples:
                garanti:
                  summary: Garanti BBVA Bank as of today
                  value:

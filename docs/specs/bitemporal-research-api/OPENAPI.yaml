openapi: 3.1.0
info:
  title: Aslan Terminal Research API
  version: 1.0.0-alpha
  description: |
    Bitemporal point-in-time research API. Moat 2 of the Aslan Terminal
    Bloomberg-bar platform.

    Every endpoint accepts an optional `as_of` (ISO8601 with TZ) parameter
    and returns the platform's view of a fact **as it was known at that
    wall-clock instant**. Later revisions of the fact do not retroactively
    alter the answer for past `as_of` values.

    See:
    - SCOPE.md (binding decisions D1-D30)
    - ADR-003 (the seven moats; Moat 2 is bitemporal correctness)
    - workspace CLAUDE.md (mission and quality bar)

    The service is read-only in v1. Write paths live in `aslan-event-extractor`
    (agg.*) and `crawl` (kap.*). All Turkish content is preserved verbatim
    per ADR-002 (no auto-translation).
  termsOfService: https://docs.aslanterminal.com/terms
  contact:
    name: Aslan Terminal API team
    email: api@aslanterminal.com
    url: https://docs.aslanterminal.com
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  x-aslan-replayability: true
  x-aslan-moat: 2
  x-aslan-feature-flags:
    - name: BITEMPORAL_API_ENABLED
      role: master
      default_staging: false
      default_prod: false
      decision: D27
    - name: BITEMPORAL_API_INTERVAL_QUERIES
      default_staging: true
      default_prod: true
      decision: D2
    - name: BITEMPORAL_API_ALLOW_NULL_AS_OF
      default_staging: true
      default_prod: true
      decision: D3
    - name: BITEMPORAL_API_AUTH_ADDITIONAL_SCHEMES
      default_staging: empty
      default_prod: empty
      decision: D5
    - name: BITEMPORAL_API_RATE_LIMIT_ENFORCED
      default_staging: true
      default_prod: true
      decision: D6
    - name: BITEMPORAL_API_CURSOR_VERSION
      default_staging: 1
      default_prod: 1
      decision: D7
    - name: BITEMPORAL_API_TAS29_RESTATEMENT_CHAIN
      default_staging: false
      default_prod: false
      decision: D8
    - name: BITEMPORAL_API_ENTITY_MERGE_LINEAGE
      default_staging: false
      default_prod: false
      decision: D10
    - name: BITEMPORAL_API_KAP_APPEND_ONLY_TRIGGER
      default_staging: false
      default_prod: false
      decision: D11
    - name: BITEMPORAL_API_ENVELOPE_VERSION
      default_staging: 1
      default_prod: 1
      decision: D15
    - name: BITEMPORAL_API_ERROR_FORMAT_VERSION
      default_staging: 1
      default_prod: 1
      decision: D16
    - name: BITEMPORAL_API_AUDIT_LOG_ENABLED
      default_staging: true
      default_prod: true
      decision: D18
    - name: BITEMPORAL_API_COST_LIMITS_ENFORCED
      default_staging: true
      default_prod: true
      decision: D19
    - name: BITEMPORAL_API_V2_PREVIEW
      default_staging: false
      default_prod: false
      decision: D23
    - name: BITEMPORAL_TABLE_REGISTRY_CI_ENFORCED
      default_staging: true
      default_prod: true
      decision: D28
    - name: BITEMPORAL_API_PII_EXPOSURE
      default_staging: false
      default_prod: false
      decision: D30

servers:
  - url: https://api.staging.aslanterminal.com/v1/research
    description: Staging environment (Hetzner DE, EU-region)
    x-aslan-env: staging
  - url: https://api.aslanterminal.com/v1/research
    description: Production environment (Hetzner DE, EU-region)
    x-aslan-env: production

security:
  - ApiKeyAuth: []

tags:
  - name: research
    description: |
      Bitemporal research surfaces over `ts.*`, `ref.*`, `doc.*`, `kap.*`,
      and `agg.*` data. Every endpoint accepts `as_of` for point-in-time
      queries and `as_of_range` for version-chain queries.
  - name: identifiers
    description: Cross-source entity resolution via `ref.identifier` (Moat 6).
  - name: disclosures
    description: |
      KAP disclosures with pre-bitemporal handling (D3). 462k rows total,
      ~89.7k carry sensible `as_of`; the remainder are NULL-as_of and
      surface only with `include_pre_bitemporal=true`.
  - name: filings
    description: |
      `doc.filing` PIT exposure. Empty until `aslan-event-extractor` M0
      backfill (`extract-migrate-doc-filing`) runs.
  - name: events
    description: |
      `agg.filing_event` PIT exposure. Empty until `aslan-event-extractor`
      M1 populates.
  - name: verification
    description: |
      Public verification of platform invariants. Moat 2 canary status is
      published here unauthenticated for customers, journalists, and
      regulators per ADR-003.
  - name: ops
    description: Health, version, and operational meta-endpoints.

paths:
  /observations:
    get:
      tags: [research]
      summary: List time-series observations point-in-time
      operationId: listObservations
      description: |
        Returns rows from `ts.observation` as known at `as_of`. Backed by
        the SQL function `ts.observation_at(p_as_of timestamptz)`.

        - Default `as_of` is `NOW()`.
        - `as_of_range` returns the full version chain in [T1, T2).
        - `series_id` filter is mandatory for sub-100ms p99 (D19, P2).
      parameters:
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/AsOfRange'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/DisplayTz'
        - name: series_code
          in: query
          required: false
          description: |
            Catalog series code (e.g. `BIST.GARAN.close`). Resolved at the
            API boundary to the numeric `series_id` via `ts.series_catalog`.
            Pass either `series_code` (string) or `series_id` (int); pass
            at least one for sub-100ms p99 (D19, P2).
          schema:
            type: string
            example: BIST.GARAN.close
        - name: series_id
          in: query
          required: false
          description: |
            Numeric `ts.series_catalog.series_id`. Direct DB-id access path;
            most clients should prefer `series_code`.
          schema:
            type: integer
            format: int64
            example: 1234
        - name: ts_from
          in: query
          required: false
          description: Lower bound (inclusive) on observation timestamp.
          schema:
            type: string
            format: date-time
            example: 2024-01-01T00:00:00Z
        - name: ts_to
          in: query
          required: false
          description: Upper bound (exclusive) on observation timestamp.
          schema:
            type: string
            format: date-time
            example: 2025-01-01T00:00:00Z
      responses:
        '200':
          description: Observations envelope.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-RateLimit-Tier:
              $ref: '#/components/headers/XRateLimitTier'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            ETag:
              $ref: '#/components/headers/ETag'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationListEnvelope'
              examples:
                garan_close_2024_06:
                  summary: GARAN close prices in June 2024
                  value:
                    data:
                      - series_id: 1234
                        ts: 2024-06-03T15:30:00Z
                        value: 86.45
                        unit: TRY
                        as_of: 2024-06-03T15:30:11Z
                        local_time: 2024-06-03T18:30:11+03:00
                      - series_id: 1234
                        ts: 2024-06-04T15:30:00Z
                        value: 87.10
                        unit: TRY
                        as_of: 2024-06-04T15:30:09Z
                        local_time: 2024-06-04T18:30:09+03:00
                    metadata:
                      as_of_requested: 2024-06-30T23:59:59Z
                      as_of_resolved: 2024-06-30T23:59:59Z
                      as_of_range: null
                      lineage:
                        source_filing_id: null
                        raw_bytes_sha256: null
                        extraction_code_version: null
                        prompt_version: null
                        model_identity: null
                        extraction_seed: null
                      pagination:
                        next_cursor: eyJ2IjoxLCJhc19vZiI6IjIwMjQtMDYtMzBUMjM6NTk6NTlaIiwiYW5jaG9yIjp7InNlcmllc19pZCI6IkJJU1QuR0FSQU4uY2xvc2UiLCJ0cyI6IjIwMjQtMDYtMDRUMTU6MzA6MDBaIn0sImRpcmVjdGlvbiI6ImFzYyIsImZpbHRlcnNfaGFzaCI6ImE3ZjMyZDg4In0=

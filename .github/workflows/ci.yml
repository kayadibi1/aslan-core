# .github/workflows/ci.yml
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests

  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # --all-extras pulls in [obs] + [dashboard]. The dashboard tests
      # import starlette / fasthtml / prometheus_client at module scope,
      # which collection cannot defer; without --all-extras pytest aborts
      # at collection with ModuleNotFoundError.
      - run: uv sync --all-groups --all-extras
      # testcontainers needs the docker socket, which GHA provides by default.
      - run: uv run pytest -ra
        env:
          # Settings.required envs — testcontainers overrides ASLAN_PG_DSN at runtime.
          ASLAN_PG_DSN: postgresql+asyncpg://placeholder:placeholder@localhost:5432/placeholder
          ASLAN_REDIS_URL: redis://localhost:6379/0
          ASLAN_S3_ENDPOINT: http://localhost:9000
          ASLAN_S3_REGION: us-east-1
          ASLAN_S3_ACCESS_KEY: x
          ASLAN_S3_SECRET_KEY: x

      - name: Run integration tests
        run: uv run pytest -m integration -ra
        env:
          ASLAN_PG_DSN: postgresql+asyncpg://placeholder:placeholder@localhost:5432/placeholder
          ASLAN_REDIS_URL: redis://localhost:6379/0
          ASLAN_S3_ENDPOINT: http://localhost:9000
          ASLAN_S3_REGION: us-east-1
          ASLAN_S3_ACCESS_KEY: x
          ASLAN_S3_SECRET_KEY: x

  # CVE scan (Task 20, v0.3.0).
  # Audits the project's locked dependency graph (including [obs]
  # extras) — NOT the tool env. Contract: pip-audit fails the build
  # on ANY vulnerability; see the pip-audit.json artifact for details.
  # Dependabot opens a remediation PR within 24h of any new CVE.
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Sync project (with obs extras)
        run: uv sync --extra obs
      - name: Export locked requirements
        # --no-emit-project: drop the editable `-e .` self-reference.
        # pip-audit looks up every line on PyPI; aslan-core isn't there
        # (and auditing the project against itself is meaningless).
        run: uv export --extra obs --format requirements-txt --no-hashes --no-emit-project --output-file requirements-locked.txt
      - name: pip-audit (CVE scan)
        run: uv tool run pip-audit --strict --requirement requirements-locked.txt --format json --output pip-audit.json
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: pip-audit.json

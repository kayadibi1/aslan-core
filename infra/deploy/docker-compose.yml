name: aslan-dashboard

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/aslan-filings
        mc anonymous set none local/aslan-filings
        echo "aslan-filings bucket ready"

  dashboard:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile
    environment:
      ASLAN_PG_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      ASLAN_DASHBOARD_DSN: "postgresql+asyncpg://aslan_dashboard:aslan_dashboard@postgres:5432/aslan"
      ASLAN_DASHBOARD_PASSWORD: "aslan_dashboard"
      ASLAN_REDIS_URL: "redis://redis:6379/0"
    ports:
      - "127.0.0.1:8585:8585"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scraper:
    build:
      context: /home/emersus
      dockerfile: aslan-core/infra/deploy/Dockerfile.scraper
    environment:
      KAP_ENV: prod
      KAP_POSTGRES_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      KAP_REDIS_URL: "redis://redis:6379/0"
      KAP_S3_ENDPOINT: "http://minio:9000"
      KAP_S3_ACCESS_KEY: minioadmin
      KAP_S3_SECRET_KEY: minioadmin
      KAP_S3_REGION: us-east-1
      KAP_S3_RAW_BUCKET: aslan-filings
      KAP_INSTANCE_ID: hetzner-prod-1
      ASLAN_PG_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      ASLAN_REDIS_URL: "redis://redis:6379/0"
      ASLAN_S3_ENDPOINT: "http://minio:9000"
      ASLAN_S3_REGION: us-east-1
      ASLAN_S3_ACCESS_KEY: minioadmin
      ASLAN_S3_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    profiles:
      - scraper
    entrypoint: ["kap-sync-entities"]

  tail:
    build:
      context: /home/emersus
      dockerfile: aslan-core/infra/deploy/Dockerfile.scraper
    environment:
      KAP_ENV: prod
      KAP_POSTGRES_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      KAP_REDIS_URL: "redis://redis:6379/0"
      KAP_S3_ENDPOINT: "http://minio:9000"
      KAP_S3_ACCESS_KEY: minioadmin
      KAP_S3_SECRET_KEY: minioadmin
      KAP_S3_REGION: us-east-1
      KAP_S3_RAW_BUCKET: aslan-filings
      KAP_INSTANCE_ID: hetzner-tail-1
      ASLAN_PG_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      ASLAN_REDIS_URL: "redis://redis:6379/0"
      ASLAN_S3_ENDPOINT: "http://minio:9000"
      ASLAN_S3_REGION: us-east-1
      ASLAN_S3_ACCESS_KEY: minioadmin
      ASLAN_S3_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    entrypoint: ["kap-tail"]
    restart: unless-stopped

  body-fetcher:
    build:
      context: /home/emersus
      dockerfile: aslan-core/infra/deploy/Dockerfile.scraper
    environment:
      KAP_ENV: prod
      KAP_POSTGRES_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      KAP_REDIS_URL: "redis://redis:6379/0"
      KAP_S3_ENDPOINT: "http://minio:9000"
      KAP_S3_ACCESS_KEY: minioadmin
      KAP_S3_SECRET_KEY: minioadmin
      KAP_S3_REGION: us-east-1
      KAP_S3_RAW_BUCKET: aslan-filings
      KAP_INSTANCE_ID: hetzner-fetcher-1
      ASLAN_PG_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      ASLAN_REDIS_URL: "redis://redis:6379/0"
      ASLAN_S3_ENDPOINT: "http://minio:9000"
      ASLAN_S3_REGION: us-east-1
      ASLAN_S3_ACCESS_KEY: minioadmin
      ASLAN_S3_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    entrypoint: ["kap-body-fetcher"]
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile
    env_file:
      - .env
    environment:
      ASLAN_PG_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
    ports:
      - "127.0.0.1:8600:8600"
    entrypoint: ["/app/.venv/bin/aslan", "api", "serve", "--host", "0.0.0.0", "--port", "8600"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped


  tefas-puller:
    build:
      context: /home/emersus
      dockerfile: aslan-tefas-puller/Dockerfile
    environment:
      TEFAS_POSTGRES_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      ASLAN_PG_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      ASLAN_REDIS_URL: "redis://redis:6379/0"
      ASLAN_S3_ENDPOINT: "http://minio:9000"
      ASLAN_S3_REGION: us-east-1
      ASLAN_S3_ACCESS_KEY: minioadmin
      ASLAN_S3_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tefas

  bist-puller:
    build:
      context: /home/emersus
      dockerfile: aslan-bist-puller/Dockerfile
    environment:
      BIST_POSTGRES_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      ASLAN_PG_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      ASLAN_REDIS_URL: "redis://redis:6379/0"
      ASLAN_S3_ENDPOINT: "http://minio:9000"
      ASLAN_S3_REGION: us-east-1
      ASLAN_S3_ACCESS_KEY: minioadmin
      ASLAN_S3_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - bist


  evds-puller:
    build:
      context: /home/emersus
      dockerfile: aslan-evds-puller/Dockerfile
    environment:
      EVDS_POSTGRES_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      EVDS_API_KEY: "${EVDS_API_KEY}"
      ASLAN_PG_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      ASLAN_REDIS_URL: "redis://redis:6379/0"
      ASLAN_S3_ENDPOINT: "http://minio:9000"
      ASLAN_S3_REGION: us-east-1
      ASLAN_S3_ACCESS_KEY: minioadmin
      ASLAN_S3_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - evds


  mkk-puller:
    build:
      context: /home/emersus
      dockerfile: aslan-mkk-puller/Dockerfile
    environment:
      MKK_POSTGRES_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      ASLAN_PG_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      ASLAN_REDIS_URL: "redis://redis:6379/0"
      ASLAN_S3_ENDPOINT: "http://minio:9000"
      ASLAN_S3_REGION: us-east-1
      ASLAN_S3_ACCESS_KEY: minioadmin
      ASLAN_S3_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - mkk

  event-extractor:
    build:
      context: /home/emersus
      dockerfile: aslan-core/infra/deploy/Dockerfile.event-extractor
    env_file:
      - .env
    environment:
      EXTRACTOR_POSTGRES_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      ASLAN_PG_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      ASLAN_REDIS_URL: "redis://redis:6379/0"
      ASLAN_S3_ENDPOINT: "http://minio:9000"
      ASLAN_S3_REGION: us-east-1
      ASLAN_S3_ACCESS_KEY: minioadmin
      ASLAN_S3_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - event-extractor

  # Moat 2 bitemporal canary. Re-runs ≥10 hand-curated KAP-amendment
  # cases every 5 minutes; writes status into
  # aslan_core.feature_flags.MOAT_2_CANARY_STATUS, increments the
  # moat_2_canary_failures_total Prometheus counter on red, and emits
  # the JSON failing-cases blob into the flag's `notes` column for
  # RUNBOOK §5a triage.
  #
  # Profile-gated: only starts under `docker compose --profile
  # bitemporal-canary up bitemporal-canary`. Mirrors the workspace
  # convention of long-running services using
  # `restart: unless-stopped`; the host crontab is reserved for
  # heavyweight pullers, and a 5-minute internal Python loop is
  # cheaper than a per-tick container spawn.
  #
  # TODO: when the workspace adopts a uniform cron container pattern,
  # migrate this to that pattern instead of the in-process
  # `while true; sleep 300` loop. Until then this is the simplest
  # thing that mirrors the existing tail/body-fetcher long-running
  # service shape.
  bitemporal-canary:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile
    env_file:
      - .env
    environment:
      ASLAN_PG_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      ASLAN_REDIS_URL: "redis://redis:6379/0"
      BITEMPORAL_CANARY_INTERVAL_SECONDS: "300"
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        echo "bitemporal-canary: starting; interval=${BITEMPORAL_CANARY_INTERVAL_SECONDS}s"
        while true; do
          /app/.venv/bin/python scripts/canary_moat_2.py || true
          sleep "${BITEMPORAL_CANARY_INTERVAL_SECONDS}"
        done
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - bitemporal-canary
    restart: unless-stopped

volumes:
  pg_data:
  minio_data:

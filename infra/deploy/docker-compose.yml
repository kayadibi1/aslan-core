name: aslan-dashboard

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/aslan-filings
        mc anonymous set none local/aslan-filings
        echo "aslan-filings bucket ready"

  dashboard:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile
    environment:
      ASLAN_PG_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      ASLAN_DASHBOARD_DSN: "postgresql+asyncpg://aslan_dashboard:aslan_dashboard@postgres:5432/aslan"
      ASLAN_DASHBOARD_PASSWORD: "aslan_dashboard"
      ASLAN_REDIS_URL: "redis://redis:6379/0"
    ports:
      - "127.0.0.1:8585:8585"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scraper:
    build:
      context: /home/emersus
      dockerfile: aslan-core/infra/deploy/Dockerfile.scraper
    environment:
      KAP_ENV: prod
      KAP_POSTGRES_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      KAP_REDIS_URL: "redis://redis:6379/0"
      KAP_S3_ENDPOINT: "http://minio:9000"
      KAP_S3_ACCESS_KEY: minioadmin
      KAP_S3_SECRET_KEY: minioadmin
      KAP_S3_REGION: us-east-1
      KAP_S3_RAW_BUCKET: aslan-filings
      KAP_INSTANCE_ID: hetzner-prod-1
      ASLAN_PG_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      ASLAN_REDIS_URL: "redis://redis:6379/0"
      ASLAN_S3_ENDPOINT: "http://minio:9000"
      ASLAN_S3_REGION: us-east-1
      ASLAN_S3_ACCESS_KEY: minioadmin
      ASLAN_S3_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    profiles:
      - scraper
    entrypoint: ["kap-sync-entities"]

  tail:
    build:
      context: /home/emersus
      dockerfile: aslan-core/infra/deploy/Dockerfile.scraper
    environment:
      KAP_ENV: prod
      KAP_POSTGRES_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      KAP_REDIS_URL: "redis://redis:6379/0"
      KAP_S3_ENDPOINT: "http://minio:9000"
      KAP_S3_ACCESS_KEY: minioadmin
      KAP_S3_SECRET_KEY: minioadmin
      KAP_S3_REGION: us-east-1
      KAP_S3_RAW_BUCKET: aslan-filings
      KAP_INSTANCE_ID: hetzner-tail-1
      ASLAN_PG_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      ASLAN_REDIS_URL: "redis://redis:6379/0"
      ASLAN_S3_ENDPOINT: "http://minio:9000"
      ASLAN_S3_REGION: us-east-1
      ASLAN_S3_ACCESS_KEY: minioadmin
      ASLAN_S3_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    entrypoint: ["kap-tail"]
    restart: unless-stopped

  body-fetcher:
    build:
      context: /home/emersus
      dockerfile: aslan-core/infra/deploy/Dockerfile.scraper
    environment:
      KAP_ENV: prod
      KAP_POSTGRES_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      KAP_REDIS_URL: "redis://redis:6379/0"
      KAP_S3_ENDPOINT: "http://minio:9000"
      KAP_S3_ACCESS_KEY: minioadmin
      KAP_S3_SECRET_KEY: minioadmin
      KAP_S3_REGION: us-east-1
      KAP_S3_RAW_BUCKET: aslan-filings
      KAP_INSTANCE_ID: hetzner-fetcher-1
      ASLAN_PG_DSN: "postgresql+asyncpg://aslan:aslan@postgres:5432/aslan"
      ASLAN_REDIS_URL: "redis://redis:6379/0"
      ASLAN_S3_ENDPOINT: "http://minio:9000"
      ASLAN_S3_REGION: us-east-1
      ASLAN_S3_ACCESS_KEY: minioadmin
      ASLAN_S3_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    entrypoint: ["kap-body-fetcher"]
    restart: unless-stopped

volumes:
  pg_data:
  minio_data:
